[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physicalai-track1"
version = "0.1.0"
description = "AI City Challenge Track 1 Multi-Camera 3D Perception utilities"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.9",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
